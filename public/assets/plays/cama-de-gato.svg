<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-hidden="true">
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="21" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply" opacity="0.13"/>
  </filter>
  <style>
    .line{fill:none;stroke:#27364a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#27364a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ink{fill:#27364a}.skin{fill:#f4b997}.hair{fill:#52322a}.hair2{fill:#8a5a3b}.shadow{fill:#27364a;opacity:.08}.smile{fill:none;stroke:#27364a;stroke-width:4;stroke-linecap:round}
  </style>
</defs>
<rect width="560" height="380" fill="#f7efe2" filter="url(#paper)"/>
<circle cx="92" cy="80" r="48" fill="#7b6cc7" opacity=".2"/>
<circle cx="486" cy="304" r="64" fill="#ffffff" opacity=".22"/>
<path class="thin" stroke="#ffffff" opacity=".62" d="M40 108c54-36 108-36 162 0M382 92c30-20 60-20 90 0"/>
<ellipse class="shadow" cx="280" cy="336" rx="158" ry="18"/>

<!-- crianca esquerda -->
<g transform="translate(60 112)">
  <circle class="skin" cx="50" cy="34" r="29"/>
  <path class="hair" d="M25 26c7-29 34-38 57-17 4 17-8 32-21 41-6-17-21-24-36-24z"/>
  <path class="smile" d="M42 42q8 7 18 0"/>
  <rect x="26" y="62" width="54" height="72" rx="22" fill="#2b8fb8"/>
  <path class="line" d="M30 90 74 116M76 90l30 26M44 133 32 196M68 133l14 63"/>
</g>

<!-- crianca direita -->
<g transform="translate(390 112) scale(-1 1)">
  <circle class="skin" cx="50" cy="34" r="29"/>
  <path class="hair2" d="M25 26c7-29 34-38 57-17 4 17-8 32-21 41-6-17-21-24-36-24z"/>
  <path class="smile" d="M42 42q8 7 18 0"/>
  <rect x="26" y="62" width="54" height="72" rx="22" fill="#ef6b5a"/>
  <path class="line" d="M30 90 74 116M76 90l30 26M44 133 32 196M68 133l14 63"/>
</g>

<!-- barbante entre as maos, figura de cama de gato -->
<g stroke="#ef6b5a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M188 212 372 212"/>
  <path d="M188 240 372 240"/>
  <path d="M188 212 372 240"/>
  <path d="M372 212 188 240"/>
  <path d="M188 212q-16 14 0 28M372 212q16 14 0 28"/>
</g>
<circle cx="280" cy="226" r="9" fill="#f4bd45" stroke="#27364a" stroke-width="5"/>
</svg>
