<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-hidden="true">
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="14" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply" opacity="0.13"/>
  </filter>
  <style>
    .line{fill:none;stroke:#27364a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#27364a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ink{fill:#27364a}.skin{fill:#f4b997}.hair{fill:#52322a}.shadow{fill:#27364a;opacity:.08}.smile{fill:none;stroke:#27364a;stroke-width:4;stroke-linecap:round}
  </style>
</defs>
<rect width="560" height="380" fill="#f7efe2" filter="url(#paper)"/>
<circle cx="470" cy="86" r="52" fill="#f4bd45" opacity=".24"/>
<circle cx="84" cy="300" r="66" fill="#ffffff" opacity=".22"/>
<path class="thin" stroke="#ffffff" opacity=".62" d="M44 96c56-38 112-38 168 0M372 78c30-20 60-20 90 0"/>
<ellipse class="shadow" cx="330" cy="322" rx="132" ry="18"/>

<!-- crianca agachada, lancando -->
<g transform="translate(96 108)">
  <circle class="skin" cx="52" cy="34" r="30"/>
  <path class="hair" d="M27 26c7-30 35-39 58-18 4 18-8 33-21 42-6-18-22-24-37-24z"/>
  <path class="smile" d="M44 42q8 7 18 0"/>
  <rect x="28" y="63" width="56" height="74" rx="23" fill="#4f9f68"/>
  <path class="line" d="M32 92 4 128M80 90l44 14M46 136 34 200M72 136l34 62"/>
</g>

<!-- cordao do piao -->
<path class="thin" stroke="#ef6b5a" d="M222 214c34-6 62 2 86 22"/>

<!-- piao girando -->
<g transform="translate(300 196)">
  <path class="line" fill="#f4bd45" d="M14 6h84l-42 78z"/>
  <path class="line" d="M56 84v22"/>
  <path class="thin" d="M14 6h84"/>
  <circle class="ink" cx="56" cy="112" r="7"/>
</g>

<!-- rastro de rotacao -->
<path class="thin" stroke="#2b8fb8" opacity=".7" d="M286 176c22-16 76-16 98 0M296 158c20-12 58-12 78 0"/>
</svg>
